# Gerenciador de usuário do "cerebro" (uid 1002): tudo que ele sobe (o Hermes e os terminais dele) vê um /tmp só dele,
# sem os arquivos do dgc. PrivateTmp dentro da unit de usuário falha nesta VM (apparmor_restrict_unprivileged_userns=1),
# então a opção vai no user@1002.service, que roda como serviço de sistema. Conferir o uid: id -u cerebro.
[Service]
PrivateTmp=yes
